<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GIBI Roboter – Infos</title>
  <link rel="icon" type="image/png" href="MB_star_S-pos.png" />
</head>

<body>
  <nav class="navigation">
    <h1>Dashboard</h1>
    <ul>
      <li><a href="/home"><img src="/Home.png" height="20" width="20"></a></li>
      <li><a href="/webcam"><img src="/Webcam.png" height="20" width="22"></a></li>
      <li><a href="/team"><img src="/Team.png" height="20" width="24"></a></li>
      <li><a href="/infos"><img src="/Infos.png" height="20" width="20"></a></li>
    </ul>
  </nav>

  

  <!-- CONTAINER 1: NUR DIE ÜBERSCHRIFT (INFO) -->
  <div class="container text-container">
    <h1>Infos</h1>
    <!-- Hier könnte weiterer Text stehen -->
  </div>

  <!-- CONTAINER 2: NUR DER ROBOTER (VIEWER) -->
  <div class="container viewer-container">
    <div id="wrapper">
      <canvas id="base"></canvas>
      <canvas id="glow"></canvas>
    </div>
  </div>

  <div id="tooltip"></div>

  <script>
/* Bauteile-Namen */
const PART_NAMES = {
  1:"Arm axis left",2:"Arm axis right",3:"Arm cap left",4:"Arm cap right",
  5:"Arm cup left",6:"Arm cup right",7:"Arm left",8:"Arm right",
  9:"Back left",10:"Back right",11:"Base",12:"Bust left",
  13:"Bust right",14:"Chest left",15:"Chest right",16:"Face back plate",
  17:"Face front plate",18:"Front",19:"Head bottom left",
  20:"Head bottom right",21:"Head cap left",22:"Head cap right",
  23:"Head top left",24:"Head top right",25:"Knob",26:"Lock",
  27:"Neck axis 1",28:"Neck axis 2",29:"Neck axis 3",30:"Neck center",
  31:"Shoulder left",32:"Shoulder right",33:"Wheel left",
  34:"Wheel right",35:"Servo motor",36:"Motor",37:"Arduino",
  38:"Pixel display",39:"Display",40:"Wheel",
  41:"Converter",42:"Motor shield",43:"Display holder",
  44:"Battery holder",45:"Front wheel"
};

/* Objekt → Bauteil */
const OBJECT_TO_PART = {
  1:21,2:16,3:23,4:38,5:17,6:24,7:22,8:19,
  9:7,10:3,11:1,12:27,13:35,14:35,15:5,16:20,
  17:28,18:25,19:35,20:9,21:31,22:25,23:10,
  24:35,25:26,26:29,27:26,28:44,29:14,30:12,
  31:30,32:13,33:40,34:32,35:4,36:33,
  37:35,38:35,39:36,40:6,41:15,42:0,43:2,44:37,
  45:8,46:43,47:39,48:36,49:42,50:41,
  51:34,52:45,53:18,54:11,55:40
};

/* Setup */
const wrapper = document.getElementById("wrapper");
const tooltip = document.getElementById("tooltip");

const img = new Image();
const tpl = new Image();
img.src = "/img.png";
tpl.src = "/template.png";

const base = document.getElementById("base");
const glow = document.getElementById("glow");
const bctx = base.getContext("2d");
const gctx = glow.getContext("2d");

const mask = document.createElement("canvas");
const mctx = mask.getContext("2d");

let width, height, objectMap;

/*  Viewer-Höhe so setzen, dass die Seite NIE scrollen muss */
function fitViewerToViewport(){
  const wrapperRect = wrapper.getBoundingClientRect();

  // wie viel Platz bleibt bis unten im Viewport
  const gapBelow = 20; // bisschen Luft
  const available = window.innerHeight - wrapperRect.top - gapBelow;

  // Minimum/Maximum, damit es nicht zu klein/zu groß wird
  const clamped = Math.max(150, Math.min(available, window.innerHeight * 0.7)); // Minimum etwas reduziert

  wrapper.style.height = Math.floor(clamped) + "px";
}

/*Init */
Promise.all([
  new Promise(r => img.onload = r),
  new Promise(r => tpl.onload = r)
]).then(() => {
  width = img.width;
  height = img.height;

  // Canvas echte Pixelgröße = Bildgröße
  [base, glow, mask].forEach(c => {
    c.width = width;
    c.height = height;
  });

  bctx.drawImage(img,0,0);
  mctx.drawImage(tpl,0,0);

  objectMap = buildObjectMap();

  // Viewer in Screen einpassen
  fitViewerToViewport();
  window.addEventListener("resize", fitViewerToViewport);

  glow.addEventListener("mousemove", onMove);
  glow.addEventListener("mouseleave", clearHover);
});

/* Template Erkennung */
const DARK = 40, ALPHA = 10;
function isObjectPixel(r,g,b,a){
  return a > ALPHA && r <= DARK && g <= DARK && b <= DARK;
}

function buildObjectMap(){
  const d = mctx.getImageData(0,0,width,height).data;
  const map = new Int32Array(width*height).fill(-1);
  let id = 1;

  for(let y=0;y<height;y++){
    for(let x=0;x<width;x++){
      const i=y*width+x, p=i*4;
      if(map[i]!==-1) continue;
      if(!isObjectPixel(d[p],d[p+1],d[p+2],d[p+3])) continue;

      const stack=[[x,y]];
      while(stack.length){
        const [cx,cy]=stack.pop();
        const ci=cy*width+cx, cp=ci*4;
        if(map[ci]!==-1) continue;
        if(!isObjectPixel(d[cp],d[cp+1],d[cp+2],d[cp+3])) continue;
        map[ci]=id;
        if(cx>0) stack.push([cx-1,cy]);
        if(cx<width-1) stack.push([cx+1,cy]);
        if(cy>0) stack.push([cx,cy-1]);
        if(cy<height-1) stack.push([cx,cy+1]);
      }
      id++;
    }
  }
  return map;
}

/* Tooltip Pos */
function placeTooltipNearMouse(e){
  const OFFSET = 14;
  const pad = 8;
  const r = tooltip.getBoundingClientRect();

  let left = e.clientX + OFFSET;
  let top  = e.clientY + OFFSET;

  if(r.right > window.innerWidth - pad) left = e.clientX - r.width - OFFSET;
  if(r.bottom > window.innerHeight - pad) top = e.clientY - r.height - OFFSET;

  tooltip.style.left = Math.max(pad, left) + "px";
  tooltip.style.top  = Math.max(pad, top) + "px";
}

/* Hover */
function onMove(e){
  const rect = glow.getBoundingClientRect();
  const x = Math.floor((e.clientX - rect.left) * width / rect.width);
  const y = Math.floor((e.clientY - rect.top) * height / rect.height);

  if(x < 0 || y < 0 || x >= width || y >= height){
    clearHover();
    return;
  }

  const objId = objectMap[y * width + x];
  const partId = OBJECT_TO_PART[objId];

  if(!partId || partId === 0){
    clearHover();
    return;
  }

  gctx.clearRect(0,0,width,height);
  gctx.shadowColor = "rgba(0,255,255,1)";
  gctx.shadowBlur  = 30;
  gctx.fillStyle   = "rgba(0,255,255,0.7)";

  for(let i=0;i<objectMap.length;i++){
    if(objectMap[i] === objId){
      gctx.fillRect(i % width, Math.floor(i / width), 1, 1);
    }
  }

  tooltip.textContent = PART_NAMES[partId] || "Unbekannt";
  tooltip.classList.add("show");
  placeTooltipNearMouse(e);
}

/* Clear */
function clearHover(){
  gctx.clearRect(0,0,width,height);
  tooltip.classList.remove("show");
}
</script>

<style>
/* Styles */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

/* Body */
body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #ffffff 0%, #666666 60%, #000000 90%);
    background-attachment: fixed;
    height: 100vh;
    overflow: hidden;
    padding: 20px;
    
    /* ÄNDERUNG: Flexbox mit Gap für Abstand zwischen den Containern */
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 30px; /* Hier wird der Abstand zwischen Info, Roboter und Navi gesteuert */
}

/* CSS Variables */
:root {
    --accent: #000000;
    --text-soft: #ffffff;
    --text-main: #000000;
}

/* Container Styles */
.container {
    background: white;
    border-radius: 20px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    padding: 20px; /* Padding etwas reduziert, da Inhalt aufgeteilt */
    max-width: 700px;
    width: 100%;
    margin: 0;
    animation: slideInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    display: flex;
    flex-direction: column;
}

.container:hover {
    transform: translateY(-4px);
    box-shadow: 0 26px 70px rgba(0, 0, 0, 0.35);
}

/* Spezifische Anpassungen für die Container */
.text-container {
    padding: 20px 40px;
    flex-shrink: 0; /* Soll nicht kleiner werden */
}

.viewer-container {
    /* Soll den restlichen Platz bis zum Minimum einnehmen? 
       Nein, die JS Funktion fitViewerToViewport regelt die Höhe des Wrappers */
    padding: 40px;
    margin-bottom: 20px; /* Extra Abstand unten */
}


/* Navigation */
.navigation {
    background: white;
    border-radius: 15px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    padding: 12px 20px;
    /* margin-bottom entfernt, da wir body gap nutzen, aber sicherheitshalber resetten */
    margin: 0; 
    width: 100%;
    max-width: 700px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    backdrop-filter: blur(10px);
    animation: slideInDown 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    z-index: 10;
    flex-shrink: 0;
}

.navigation:hover {
    transform: translateY(-3px);
    box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
}

.navigation h1 {
    font-size: 1.2em;
    margin: 0;
    color: #333;
    animation: fadeIn 0.8s ease 0.3s both;
}

.navigation ul {
    list-style: none;
    display: flex;
    gap: 20px;
    margin: 0;
    padding: 0;
}

.navigation li a {
    text-decoration: none;
    transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 8px;
    border-radius: 10px;
    position: relative;
    background: transparent;
}

.navigation li a:hover {
    transform: translateY(-5px) scale(1.15);
    background: rgba(255, 255, 255, 0.95);
    box-shadow: 
        0 0 20px rgba(255, 255, 255, 0.8),
        0 0 40px rgba(255, 255, 255, 0.6),
        0 0 60px rgba(255, 255, 255, 0.4),
        0 15px 30px rgba(0, 0, 0, 0.3);
}

.navigation li a:active {
    transform: translateY(-2px) scale(1.08);
}

.navigation li a img {
    display: block;
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.3s ease;
    position: relative;
    z-index: 2;
}

.navigation li a:hover img {
    transform: scale(1.1);
    filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.4)) brightness(1.1);
}

/* Bottom Right Logo */
.bottom-right-image {
    position: fixed;
    bottom: 20px;
    right: 20px;
    z-index: 1000;
    animation: floatLogo 4s ease-in-out infinite;
    cursor: pointer;
    transition: transform 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
}

.bottom-right-image img {
    filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.35));
    transition: all 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
}

.bottom-right-image:hover {
    transform: none;
}
.bottom-right-image:hover img {
    animation: none;
    filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.35));
}

/* Titles */
h1 {
    text-align: center;
    color: #333;
    margin-bottom: 0; /* Margin im Text-Container selbst regeln */
    font-size: 2.5em;
    animation: fadeInScale 0.7s ease 0.2s both;
}

/* Animations */
@keyframes slideInUp {
    from { opacity: 0; transform: translateY(40px); }
    to { opacity: 1; transform: translateY(0); }
}
@keyframes slideInDown {
    from { opacity: 0; transform: translateY(-30px); }
    to { opacity: 1; transform: translateY(0); }
}
@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}
@keyframes fadeInScale {
    from { opacity: 0; transform: scale(0.95); }
    to { opacity: 1; transform: scale(1); }
}
@keyframes floatLogo {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
}

/* Viewer */
#wrapper {
    position: relative;
    width: 100%;
    margin-top: 0; /* Margin entfernen, da im Container Padding ist */
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 18px 40px rgba(0, 0, 0, .25);
    background: rgba(0, 0, 0, .06);
    animation: fadeInScale 0.7s ease 0.4s both;
}

canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
}

#tooltip {
    position: fixed;
    pointer-events: none;
    background: rgba(0, 0, 0, .85);
    color: #fff;
    font-size: .85rem;
    padding: 8px 14px;
    border-radius: 999px;
    white-space: nowrap;
    opacity: 0;
    transition: opacity 0.12s ease;
    z-index: 99999;
    box-shadow: 0 5px 15px rgba(0, 0, 0, 0.4);
}
#tooltip.show { opacity: 1; }

/* Responsive */
@media (max-width: 980px) {
    .navigation, .container { max-width: 700px; }
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
    }
}
</style>
</body>
</html>
