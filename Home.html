        <head>
            <meta charset="UTF-8">

    </html>    
 <style>
/* Styles */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}


html {
    scroll-behavior: smooth;
}


body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    
    /* ÄNDERUNG: Schwarz beginnt erst sehr spät (bei 90%), damit der Bereich kleiner ist. */
    /* Der graue Übergangsbereich (#666666) wurde ebenfalls etwas nach hinten (60%) geschoben. */
    background: linear-gradient(135deg, #ffffff 0%, #666666 60%, #000000 90%);
    
    /* Hintergrund fixieren */
    background-attachment: fixed;
    
    min-height: 100vh;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
}


/* CSS Variables */
:root {
    --accent: #000000;
    --text-soft: #ffffff;
    --text-main: #000000;
}


/* Container Styles */
.container {
    background: white;
    border-radius: 20px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    padding: 40px;
    max-width: 700px;
    width: 100%;
    margin: 0;
    animation: slideInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
}


.container:hover {
    transform: translateY(-4px);
    box-shadow: 0 26px 70px rgba(0, 0, 0, 0.35);
}


.container-wrapper {
    display: flex;
    flex-direction: row;
    gap: 2rem;
    justify-content: center;
    width: 100%;
    max-width: 1200px;
    align-items: flex-start;
}


.container-controller {
    background: white;
    border-radius: 20px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    padding: 40px;
    max-width: 700px;
    width: 100%;
    margin: 30px 0 0 0;
    animation: slideInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.15s both;
}


/*  Navigation */
.navigation {
    background: white;
    border-radius: 15px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    padding: 12px 20px;
    margin: 0 0 70px 0;
    width: 100%;
    max-width: 700px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    backdrop-filter: blur(10px);
    animation: slideInDown 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
}


.navigation:hover {
    transform: translateY(-3px);
    box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
}


.navigation h1 {
    font-size: 1.2em;
    margin: 0;
    color: #333;
    animation: fadeIn 0.8s ease 0.3s both;
}


.navigation ul {
    list-style: none;
    display: flex;
    gap: 20px;
    margin: 0;
    padding: 0;
}


/*  Navigation */
.navigation li a {
    text-decoration: none;
    transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 8px;
    border-radius: 10px;
    position: relative;
    background: transparent;
}


.navigation li a:hover {
    transform: translateY(-5px) scale(1.15);
    background: rgba(255, 255, 255, 0.95);
    box-shadow: 
        0 0 20px rgba(255, 255, 255, 0.8),
        0 0 40px rgba(255, 255, 255, 0.6),
        0 0 60px rgba(255, 255, 255, 0.4),
        0 15px 30px rgba(0, 0, 0, 0.3);
}


.navigation li a:active {
    transform: translateY(-2px) scale(1.08);
}


.navigation li a img {
    display: block;
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.3s ease;
    position: relative;
    z-index: 2;
}


.navigation li a:hover img {
    transform: scale(1.1);
    filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.4)) brightness(1.1);
}


/*  Bottom Right Logo */
.bottom-right-image {
    position: fixed;
    bottom: 20px;
    right: 20px;
    z-index: 1000;
    animation: floatLogo 4s ease-in-out infinite;
    cursor: pointer;
    transition: transform 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
}




/* Title */
h1 {
    text-align: center;
    color: #333;
    margin-bottom: 10px;
    font-size: 2.5em;
    animation: fadeInScale 0.7s ease 0.2s both;
}


.subtitle {
    text-align: center;
    color: #999;
    margin-bottom: 30px;
    font-size: 0.9em;
    letter-spacing: 0.08em;
    animation: fadeIn 0.8s ease 0.4s both;
}


.section-title {
    margin-top: 14px;
    text-align: center;
    font-size: 1.2rem;
    color: #333;
    animation: fadeIn 0.8s ease 0.5s both;
}


.section-subtitle {
    text-align: center;
    color: #777;
    margin: 8px 0 18px;
    font-size: 0.95rem;
    animation: fadeIn 0.9s ease 0.6s both;
}


/* Video Container */
.video-container {
    background: #000;
    border-radius: 15px;
    overflow: hidden;
    margin-bottom: 30px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    border: 1px solid rgba(255, 255, 255, 0.1);
    transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
    animation: fadeInScale 0.6s ease 0.5s both;
}


.video-container:hover {
    transform: translateY(-4px) scale(1.01);
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
    border-color: rgba(255, 255, 255, 0.25);
}


.video-container img {
    width: 100%;
    height: auto;
    display: block;
}


/*  BUTTONS */
.button {
    text-align: center;
    margin-bottom: 1rem;
    animation: fadeIn 0.8s ease 0.6s both;
}


.button-stop-start {
    width: 9rem;
    height: 3rem;
    border-radius: 30rem;
    font-size: 15px;
    border: none;
    position: relative;
    overflow: hidden;
    z-index: 1;
    box-shadow: 6px 6px 12px #c5c5c5, -6px -6px 12px #ffffff;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
}


button::before {
    content: '';
    width: 0;
    height: 3rem;
    border-radius: 30rem;
    position: absolute;
    top: 0;
    left: 0;
    background-image: linear-gradient(to right, #C0C0C0 0%, #000000 100%);
    transition: width 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    display: block;
    z-index: -1;
}


button:hover {
    transform: translateY(-3px) scale(1.05);
    box-shadow: 8px 8px 18px #b5b5b5, -8px -8px 18px #ffffff;
    filter: brightness(1.05);
}


button:hover::before {
    width: 9rem;
}


button:active {
    transform: translateY(-1px) scale(1);
    box-shadow: 4px 4px 8px #c5c5c5, -4px -4px 8px #ffffff;
}


button:focus-visible {
    outline: 3px solid rgba(0, 0, 0, 0.3);
    outline-offset: 5px;
}


/* Status */
.status {
    text-align: center;
    margin-top: 20px;
    padding-top: 20px;
    border-top: 1px solid #eee;
    color: #999;
    font-size: 0.9em;
    animation: fadeIn 1s ease 0.7s both;
}


.status-dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    background: #4caf50;
    border-radius: 50%;
    margin-right: 5px;
    animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    box-shadow: 0 0 0 0 rgba(76, 175, 80, 0.7);
}


/*  Hint Bubble */
.hint {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 10px 14px;
    border-radius: 999px;
    margin: 16px auto 0;
    background: rgba(0, 0, 0, .04);
    border: 1px solid rgba(0, 0, 0, .06);
    color: #222;
    font-size: .9rem;
    animation: fadeInScale 0.7s ease 0.7s both;
    transition: all 0.3s ease;
}


.hint:hover {
    background: rgba(0, 0, 0, .08);
    transform: scale(1.03);
}


.hint-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #4caf50;
    animation: pulse 2s ease infinite;
}


/* Parts Viewer */
.parts-viewer {
    position: relative;
    width: 100%;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 18px 40px rgba(0, 0, 0, .25);
    background: rgba(0, 0, 0, .06);
    animation: fadeInScale 0.7s ease 0.4s both;
}


.parts-image {
    width: 100%;
    height: auto;
    display: block;
    user-select: none;
}


.hotspot {
    position: absolute;
    left: var(--x);
    top: var(--y);
    width: var(--w);
    height: var(--h);
    border-radius: 14px;
    cursor: pointer;
    background: rgba(255, 255, 255, 0);
    outline: 2px solid rgba(255, 255, 255, 0);
    box-shadow: 0 0 0 rgba(255, 255, 255, 0);
    transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
}


.hotspot:hover {
    background: rgba(255, 255, 255, .15);
    outline-color: rgba(255, 255, 255, .95);
    box-shadow: 0 0 0 2px rgba(255, 255, 255, .92), 0 0 25px rgba(255, 255, 255, .9), 0 0 60px rgba(255, 255, 255, .6);
    transform: translateY(-3px) scale(1.03);
    animation: hotspotGlow 1.5s ease-in-out infinite;
}


.parts-tooltip {
    position: absolute;
    padding: 8px 14px;
    border-radius: 999px;
    background: rgba(0, 0, 0, .85);
    color: #fff;
    font-size: .85rem;
    pointer-events: none;
    opacity: 0;
    transform: translate(-50%, -140%);
    transition: opacity 0.3s ease, transform 0.3s ease;
    white-space: nowrap;
    box-shadow: 0 5px 15px rgba(0, 0, 0, 0.4);
}


.hotspot:hover .parts-tooltip {
    opacity: 1;
    transform: translate(-50%, -150%);
}


/* Team Cards */
.team-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 24px;
    margin-top: 20px;
}


.team-member {
    background: white;
    border-radius: 16px;
    padding: 24px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
    transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    animation: fadeInScale 0.6s ease both;
}


.team-member:hover {
    transform: translateY(-8px) scale(1.03);
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.2);
}


.team-member img {
    width: 100%;
    height: auto;
    border-radius: 12px;
    margin-bottom: 16px;
    transition: transform 0.3s ease;
}


.team-member:hover img {
    transform: scale(1.05);
}


/* Keyframe Animation */


@keyframes pageFadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}


@keyframes slideInUp {
    from { opacity: 0; transform: translateY(40px); }
    to { opacity: 1; transform: translateY(0); }
}


@keyframes slideInDown {
    from { opacity: 0; transform: translateY(-30px); }
    to { opacity: 1; transform: translateY(0); }
}


@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}


@keyframes fadeInScale {
    from { opacity: 0; transform: scale(0.95); }
    to { opacity: 1; transform: scale(1); }
}


@keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 0.7; box-shadow: 0 0 0 0 rgba(76, 175, 80, 0.7); }
    50% { transform: scale(1.4); opacity: 1; box-shadow: 0 0 0 10px rgba(76, 175, 80, 0); }
}


@keyframes floatLogo {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
}


@keyframes logoRotateHorizontal {
    0% { transform: rotateY(0deg); }
    100% { transform: rotateY(360deg); }
}


@keyframes logoRotateHorizontalFast {
    0% { transform: rotateY(0deg); }
    100% { transform: rotateY(360deg); }
}


@keyframes hotspotGlow {
    0%, 100% { box-shadow: 0 0 0 2px rgba(255, 255, 255, .92), 0 0 25px rgba(255, 255, 255, .9), 0 0 60px rgba(255, 255, 255, .6); }
    50% { box-shadow: 0 0 0 2px rgba(255, 255, 255, .95), 0 0 30px rgba(255, 255, 255, 1), 0 0 70px rgba(255, 255, 255, .7); }
}


/* Responsive */


@media (max-width: 980px) {
    .container-wrapper { flex-direction: column; align-items: center; }
    .navigation, .container { max-width: 700px; }
}


/* Accesbillity */


@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
    }
}
 </style>
